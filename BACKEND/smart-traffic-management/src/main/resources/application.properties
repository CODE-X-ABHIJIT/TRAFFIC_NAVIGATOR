# ========================
# SERVER
# ========================
server.port=8090
spring.application.name=smart-traffic-management

# ========================
# H2 DATABASE (Dev Mode)
# ========================
spring.datasource.url=jdbc:h2:mem:trafficdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ========================
# CITY CONFIGURATION (Bhubaneswar)
# ========================
traffic.city.name=Bhubaneswar
traffic.city.junction-count=10
traffic.city.south-lat=20.22
traffic.city.west-lon=85.77
traffic.city.north-lat=20.38
traffic.city.east-lon=85.90

# ========================
# EXTERNAL APIS (All FREE — no keys needed)
# ========================

# TomTom (OPTIONAL — leave as NONE to use free simulation)
traffic.tomtom.api-key=NONE
traffic.tomtom.base-url=https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/10/json

# OpenWeatherMap (OPTIONAL — leave as NONE to use Open-Meteo free API)
traffic.openweather.api-key=NONE
traffic.openweather.base-url=https://api.openweathermap.org/data/2.5/weather

# ========================
# SIMULATION MODE
# ========================
# true  = Smart simulation (time-of-day patterns, no API key needed)
# false = Use TomTom API (requires valid key above)
traffic.simulation.enabled=true
traffic.data.refresh-interval-ms=30000

# ========================
# SIGNAL TIMING DEFAULTS
# ========================
traffic.signal.default-cycle-time=120
traffic.signal.min-green-time=10
traffic.signal.max-green-time=60
traffic.signal.yellow-time=3

# ========================
# LOGGING
# ========================
logging.level.com.tccs=DEBUG
logging.level.org.springframework.web.socket=INFO

# ========================
# EMERGENCY AUTO-HANDLING
# ========================
traffic.emergency.auto-clearance-enabled=true
traffic.emergency.clearance-duration-seconds=120
traffic.emergency.nearby-radius-km=1.0
traffic.emergency.vip-corridor-junctions=3